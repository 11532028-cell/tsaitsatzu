  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-deep: #090a14;
      --bg-nebula: #161830;
      --card-bg: rgba(24, 27, 52, 0.65);
      --card-border: rgba(212, 175, 55, 0.35);
      --gold-primary: #e8c766;
      --gold-soft: rgba(232, 199, 102, 0.15);
      --text-main: #f3f4f8;
      --text-muted: #9ea4c0;
      --accent-purple: #8b6df2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-nebula) 0%, var(--bg-deep) 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* 星空背景點綴 */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(1.5px 1.5px at 15% 25%, #fff, transparent),
        radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,0.8), transparent),
        radial-gradient(2px 2px at 72% 18%, var(--gold-primary), transparent),
        radial-gradient(1.5px 1.5px at 85% 78%, #fff, transparent),
        radial-gradient(1px 1px at 52% 42%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 22% 88%, var(--accent-purple), transparent),
        radial-gradient(1px 1px at 90% 35%, #fff, transparent);
      background-size: 350px 350px;
      opacity: 0.75;
      z-index: 0;
    }

    /* 右上角 28蔡 徽章 */
    .top-right-badge {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 100;
      background: linear-gradient(135deg, rgba(232, 199, 102, 0.22), rgba(139, 109, 242, 0.22));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.1em;
      box-shadow: 0 4px 20px rgba(232, 199, 102, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .top-right-badge::before {
      content: "✦";
      font-size: 0.85rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .en-title {
      font-family: 'Cinzel', serif;
      color: var(--gold-primary);
      font-size: 0.9rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(to right, #ffffff, var(--gold-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 輸入卡片 */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .field {
      flex: 1;
      min-width: 210px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--gold-primary);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(11, 13, 28, 0.8);
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.25s;
      color-scheme: dark;
    }

    input[type="date"]:focus {
      border-color: var(--gold-primary);
    }

    button.btn-submit {
      padding: 13px 28px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #e8c766 0%, #c59b27 100%);
      color: #131526;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    button.btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232, 199, 102, 0.35);
    }

    button.btn-submit:active {
      transform: translateY(0);
    }

    /* 運勢結果區塊 */
    .result-card {
      margin-top: 24px;
      display: none;
      animation: fadeUp 0.5s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .zodiac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 18px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .zodiac-title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .zodiac-symbol {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: var(--gold-soft);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--gold-primary);
    }

    .zodiac-name {
      font-size: 1.55rem;
      font-weight: 700;
      color: #fff;
    }

    .zodiac-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .today-tag {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(139, 109, 242, 0.2);
      border: 1px solid rgba(139, 109, 242, 0.45);
      color: #d6cbff;
    }

    /* 運勢分數條 */
    .scores-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    @media (max-width: 520px) {
      .scores-grid {
        grid-template-columns: 1fr;
      }
    }

    .score-item {
      background: rgba(12, 14, 29, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .score-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .score-stars {
      color: var(--gold-primary);
      letter-spacing: 2px;
    }

    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b6df2, #e8c766);
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    /* 運勢解析文字 */
    .fortune-text {
      background: rgba(232, 199, 102, 0.07);
      border-left: 3px solid var(--gold-primary);
      padding: 16px 18px;
      border-radius: 0 12px 12px 0;
      line-height: 1.75;
      font-size: 0.96rem;
      color: #e9ecf5;
      margin-bottom: 20px;
    }

    /* 幸運資訊 */
    .lucky-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }

    .lucky-box {
      background: rgba(12, 14, 29, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 8px;
    }

    .lucky-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .lucky-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-primary);
    }

    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>

        advices: [
          "豁達樂觀的心態為你招來好運，即使遇到小插曲也能幽默化解，甚至轉化為新的契機。",
          "適合規劃旅行、進修課程或接觸不同文化的事物，拓展眼界將為你帶來全新的啟發。",
          "真誠直率的風格深受大家喜愛，勇敢說出你的理想，會有志同道合的夥伴響應你的號召。"
        ]
      }
    ];

    function getZodiacIndex(month, day) {
      if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return 0; // 摩羯
      if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return 1;  // 水瓶
      if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return 2;  // 雙魚
      if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return 3;  // 牡羊
      if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return 4;  // 金牛
      if ((month === 5 && day >= 21) || (month === 6 && day <= 21)) return 5;  // 雙子
      if ((month === 6 && day >= 22) || (month === 7 && day <= 22)) return 6;  // 巨蟹
      if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return 7;  // 獅子
      if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return 8;  // 處女
      if ((month === 9 && day >= 23) || (month === 10 && day <= 23)) return 9; // 天秤
      if ((month === 10 && day >= 24) || (month === 11 && day <= 22)) return 10;// 天蠍
      return 11; // 射手
    }

    // 根據今日日期與星座產生穩定且每日變化的運勢數值
    function seededRandom(seed) {
      const x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function renderStars(score) {
      const starCount = Math.max(3, Math.min(5, Math.round(score / 20)));
      return "★".repeat(starCount) + "☆".repeat(5 - starCount);
    }

    function analyzeHoroscope() {
      const input = document.getElementById("birthday").value;
      if (!input) {
        alert("請先選擇您的生日日期！");
        return;
      }

      const parts = input.split("-");
      const month = parseInt(parts[1], 10);
      const day = parseInt(parts[2], 10);

      const zIndex = getZodiacIndex(month, day);
      const zodiac = ZODIAC_DATA[zIndex];

      const today = new Date();
      const dateSeed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
      const baseSeed = dateSeed + zIndex * 37;

      const sOverall = Math.floor(72 + seededRandom(baseSeed + 1) * 27);
      const sLove = Math.floor(65 + seededRandom(baseSeed + 2) * 34);
      const sWork = Math.floor(68 + seededRandom(baseSeed + 3) * 31);
      const sMoney = Math.floor(65 + seededRandom(baseSeed + 4) * 34);

      const adviceIdx = Math.floor(seededRandom(baseSeed + 5) * zodiac.advices.length);
      const colorIdx = Math.floor(seededRandom(baseSeed + 6) * zodiac.colors.length);
      const matchIdx = Math.floor(seededRandom(baseSeed + 7) * zodiac.matches.length);
      const luckyNum = Math.floor(1 + seededRandom(baseSeed + 8) * 99);

      document.getElementById("zSymbol").textContent = zodiac.symbol;
      document.getElementById("zName").textContent = zodiac.name;
      document.getElementById("zDateRange").textContent = `${zodiac.range} · ${zodiac.element}`;
      document.getElementById("todayDateLabel").textContent = `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()} 運勢`;

      document.getElementById("starOverall").textContent = renderStars(sOverall);
      document.getElementById("barOverall").style.width = `${sOverall}%`;

      document.getElementById("starLove").textContent = renderStars(sLove);
      document.getElementById("barLove").style.width = `${sLove}%`;

      document.getElementById("starWork").textContent = renderStars(sWork);
      document.getElementById("barWork").style.width = `${sWork}%`;

      document.getElementById("starMoney").textContent = renderStars(sMoney);
      document.getElementById("barMoney").style.width = `${sMoney}%`;

      document.getElementById("fortuneDesc").textContent = zodiac.advices[adviceIdx];
      document.getElementById("luckyColor").textContent = zodiac.colors[colorIdx];
      document.getElementById("luckyNumber").textContent = luckyNum;
      document.getElementById("luckyMatch").textContent = zodiac.matches[matchIdx];

      const card = document.getElementById("resultCard");
      card.style.display = "none";
      void card.offsetWidth; // 重新觸發動畫
      card.style.display = "block";
    }

    document.getElementById("analyzeBtn").addEventListener("click", analyzeHoroscope);
  </script>
</body>
